<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohanraje Bhosale - Digital Self</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene-canvas"></canvas>

<div id="loader">
    <div class="spinner"></div>
    <p>Initializing Digital Self...</p>
</div>

<div class="overlay-content">
    <h1>Rohanraje Bhosale</h1>
    <p>AI Engineer & Data Scientist</p>
</div>

<div class="chatbot-fab" id="chatbot-fab" title="Talk to my AI Self">
    <i class="fas fa-brain"></i>
</div>

<div class="chat-window" id="chat-window">
    <div class="chat-header">
        <h3>ROHbot</h3>
        <button class="chat-close-btn" id="chat-close-btn">×</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area" id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ask about my skills or projects...">
        <button class="chat-btn" id="mic-btn" title="Use Voice"><i class="fas fa-microphone"></i></button>
        <button class="chat-btn hidden" id="send-btn" title="Send"><i class="fas fa-paper-plane"></i></button>
        <button class="chat-btn hidden" id="stop-btn" title="Stop Speech"><i class="fas fa-stop-circle"></i></button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<script src="main.js"></script>
</body>
</html>
